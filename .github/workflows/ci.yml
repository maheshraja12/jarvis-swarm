name: JARVIS CI

on:
  push:
    branches: ["main", "chore/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Check required configuration exists
        run: python -c "from pathlib import Path; assert Path('config.py').is_file(); assert Path('brain/agent.py').is_file(); assert Path('brain/web_server.py').is_file()"
